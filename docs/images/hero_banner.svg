<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 46px; font-weight: 800; fill: #ffffff; letter-spacing: -0.5px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 500; fill: #94a3b8; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #ffffff; }
    .code-text { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 13px; fill: #38bdf8; }
    .tag-text { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 12px; font-weight: 600; fill: #10b981; }
  </style>

  <!-- Deep Background Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGradient)"/>

  <!-- Background Decorative Grid Pattern -->
  <g opacity="0.08">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200 M0 360 H1200" stroke="#94a3b8" stroke-width="1"/>
    <path d="M120 0 V420 M240 0 V420 M360 0 V420 M480 0 V420 M600 0 V420 M720 0 V420 M840 0 V420 M960 0 V420 M1080 0 V420" stroke="#94a3b8" stroke-width="1"/>
  </g>

  <!-- Glowing Radial Circles -->
  <circle cx="200" cy="180" r="160" fill="#10b981" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1020" cy="220" r="180" fill="#6366f1" opacity="0.12" filter="url(#glow)"/>

  <!-- Left Hero Section: Title & Value Proposition -->
  <g transform="translate(80, 75)">
    <!-- Pill Top Badge -->
    <rect x="0" y="0" width="280" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="16" cy="16" r="6" fill="#10b981"/>
    <text x="32" y="21" class="badge-text" fill="#cbd5e1" font-size="12">WCAG 2.2 AA &amp; PDF/UA-1 COMPLIANT</text>

    <!-- Main Title -->
    <text x="0" y="80" class="title">
      PDF Accessibility
      <tspan fill="url(#primaryGrad)"> Engine</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="125" class="subtitle">AI-Driven PDF Semantic Tagging, Ligature Repair &amp;</text>
    <text x="0" y="155" class="subtitle">Automated Standards Compliance Validation</text>

    <!-- Feature Pill Badges -->
    <g transform="translate(0, 195)">
      <!-- Badge 1: 100% Audit Pass -->
      <rect x="0" y="0" width="155" height="36" rx="10" fill="#064e3b" stroke="#059669" stroke-width="1.5"/>
      <path d="M16 18 L22 24 L32 14" stroke="#34d399" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <text x="42" y="23" class="badge-text">100% Auto Audit</text>

      <!-- Badge 2: Multimodal Gemini AI -->
      <rect x="170" y="0" width="165" height="36" rx="10" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1.5"/>
      <circle cx="190" cy="18" r="7" fill="#818cf8"/>
      <text x="208" y="23" class="badge-text">Gemini Multimodal</text>

      <!-- Badge 3: PDF/UA-1 Tree -->
      <rect x="350" y="0" width="145" height="36" rx="10" fill="#083344" stroke="#0891b2" stroke-width="1.5"/>
      <path d="M370 12 L380 18 L370 24 Z" fill="#22d3ee"/>
      <text x="388" y="23" class="badge-text">ISO 14289-1</text>
    </g>
  </g>

  <!-- Right Visual Section: Interactive Structure Tree & Compliance Card -->
  <g transform="translate(720, 50)">
    <!-- Window Card Container -->
    <rect width="410" height="320" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Window Header Bar -->
    <rect width="410" height="42" rx="14" fill="#1e293b"/>
    <rect y="28" width="410" height="14" fill="#1e293b"/>
    <circle cx="24" cy="21" r="5" fill="#ef4444"/>
    <circle cx="40" cy="21" r="5" fill="#f59e0b"/>
    <circle cx="56" cy="21" r="5" fill="#10b981"/>
    <text x="80" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8" font-weight="600">Acrobat Tag Tree &amp; Canvas Sync</text>

    <!-- Structure Tree Nodes Representation -->
    <g transform="translate(24, 62)">
      <!-- Root Node -->
      <text x="0" y="15" class="tag-text">&lt;StructTreeRoot&gt;</text>
      <path d="M 12 25 V 230" stroke="#334155" stroke-width="1.5" stroke-dasharray="3 3"/>
      
      <!-- Document Node -->
      <g transform="translate(20, 30)">
        <path d="M -8 10 H 10" stroke="#334155" stroke-width="1.5"/>
        <text x="14" y="14" class="tag-text">&lt;Document&gt;</text>
        <rect x="110" y="2" width="75" height="18" rx="4" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
        <text x="118" y="15" class="code-text" font-size="10" fill="#34d399">Title: H1</text>
      </g>

      <!-- Headings Node -->
      <g transform="translate(20, 68)">
        <path d="M -8 10 H 10" stroke="#334155" stroke-width="1.5"/>
        <text x="14" y="14" class="tag-text">&lt;H1&gt; ... &lt;H4&gt;</text>
        <text x="130" y="14" class="code-text" font-size="11" fill="#cbd5e1">MCID [1] ↔ [48]</text>
      </g>

      <!-- Table Node -->
      <g transform="translate(20, 106)">
        <path d="M -8 10 H 10" stroke="#334155" stroke-width="1.5"/>
        <text x="14" y="14" class="tag-text">&lt;Table&gt; &lt;TR&gt; &lt;TH&gt;</text>
        <rect x="155" y="2" width="95" height="18" rx="4" fill="#1e293b" stroke="#06b6d4" stroke-width="1"/>
        <text x="162" y="15" class="code-text" font-size="10" fill="#38bdf8">/Scope /ColSpan</text>
      </g>

      <!-- List Node -->
      <g transform="translate(20, 144)">
        <path d="M -8 10 H 10" stroke="#334155" stroke-width="1.5"/>
        <text x="14" y="14" class="tag-text">&lt;L&gt; &lt;LI&gt; &lt;LBody&gt;</text>
        <text x="155" y="14" class="code-text" font-size="11" fill="#cbd5e1">Nested Sub-lists</text>
      </g>

      <!-- Link Node -->
      <g transform="translate(20, 182)">
        <path d="M -8 10 H 10" stroke="#334155" stroke-width="1.5"/>
        <text x="14" y="14" class="tag-text">&lt;Link&gt; &lt;OBJR&gt;</text>
        <rect x="135" y="2" width="85" height="18" rx="4" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
        <text x="143" y="15" class="code-text" font-size="10" fill="#a78bfa">ParentTree</text>
      </g>
    </g>

    <!-- Bottom Status Strip -->
    <rect y="278" width="410" height="42" rx="0" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <circle cx="24" cy="299" r="6" fill="#10b981"/>
    <text x="38" y="303" class="badge-text" fill="#e2e8f0" font-size="12">19 / 19 Compliance Checks Passed (100.0%)</text>
  </g>
</svg>
